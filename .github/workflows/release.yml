name: release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      decision: ${{ steps.check.outputs.decision }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: package.json version '$version' is not X.Y.Z" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          decision="$(bash scripts/release-check.sh "$VERSION" "$TARGET_SHA")"
          printf 'decision=%s\n' "$decision" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.check.outputs.decision == 'publish'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.check.outputs.decision == 'publish'
        run: npm ci

      - name: Build the archive
        if: steps.check.outputs.decision == 'publish'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run package
          mkdir "$RUNNER_TEMP/release"
          mv "stud-$VERSION.vsix" "$RUNNER_TEMP/release/"

      - name: Upload the release files
        if: steps.check.outputs.decision == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/stud-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.decision == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Check the release again with the write token
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          decision="$(bash scripts/release-check.sh "$VERSION" "$TARGET_SHA")"
          if [ "$decision" != publish ]; then
            echo "error: v$VERSION is no longer publishable ($decision)" >&2
            exit 1
          fi

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$(bash scripts/release-notes.sh "$VERSION")"
          gh release create "v$VERSION" "$RUNNER_TEMP/release/stud-$VERSION.vsix" --target "$TARGET_SHA" --title "v$VERSION" --notes "$notes"
